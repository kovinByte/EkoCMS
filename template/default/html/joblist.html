{include file=comm/head.html}

{include file=comm/top.html}

<div class="mx-auto w-full max-w-7xl px-4 py-12 sm:px-6 md:py-16 lg:px-8">
	<div class="grid gap-6 lg:grid-cols-2">
		{eko:list num=10 order=date}
		<div class="group flex flex-col rounded-lg border border-gray-100 bg-white p-6 shadow-md transition duration-300 hover:-translate-y-1 hover:shadow-lg">
			<div class="flex items-start justify-between gap-4">
				<div class="flex items-start gap-4">
					<span class="flex size-11 shrink-0 items-center justify-center rounded-lg bg-blue-50 text-blue-600">
						<i class="fa-solid fa-briefcase"></i>
					</span>
					<div>
						<h2 class="text-lg font-semibold text-gray-900 transition group-hover:text-blue-600">[list:title]</h2>
						<p class="mt-1 inline-flex items-center gap-1 text-xs text-gray-400">
							<i class="fa-regular fa-calendar"></i> 发布于 [list:date style=Y-m-d]
						</p>
					</div>
				</div>
				<span class="rounded-full bg-emerald-50 px-3 py-1 text-xs font-medium text-emerald-600">招聘中</span>
			</div>
			<p class="mt-4 line-clamp-3 flex-1 text-sm leading-7 text-gray-500">[list:content drophtml=1 dropblank=1 len=100]</p>
			<a href="[list:link]" class="mt-5 inline-flex h-10 w-fit items-center justify-center gap-2 rounded-sm bg-blue-600 px-5 text-sm font-medium text-white transition duration-300 hover:scale-105 hover:bg-blue-700 hover:shadow-lg">
				查看详情 <i class="fa-solid fa-arrow-right text-xs"></i>
			</a>
		</div>
		{/eko:list}
	</div>

	{include file=comm/page.html}
</div>

{include file=comm/foot.html}
