<!-- 栏目头部 -->
<section class="relative overflow-hidden bg-blue-800 pt-18">
	{eko:if('{sort:pic}'!='')}
	<img src="{sort:pic}" alt="{sort:name}" class="absolute inset-0 h-full w-full object-cover opacity-20">
	{/eko:if}
	<div class="absolute inset-0 bg-gradient-to-r from-blue-900 via-blue-800/90 to-blue-700/60"></div>
	<div class="pointer-events-none absolute -right-24 -top-24 size-96 rounded-full bg-blue-600/30 blur-3xl"></div>
	<div class="pointer-events-none absolute -bottom-32 left-1/4 size-80 rounded-full bg-cyan-500/20 blur-3xl"></div>

	<div class="relative mx-auto w-full max-w-7xl px-4 py-14 sm:px-6 md:py-20 lg:px-8">
		<nav class="flex flex-wrap items-center gap-2 text-sm text-blue-200" aria-label="当前位置">
			{eko:position separator='/'}
		</nav>
		<h1 class="mt-5 text-3xl font-bold tracking-tight text-white md:text-4xl">{sort:name}</h1>
		<p class="mt-3 max-w-2xl text-base leading-7 text-blue-100">{sort:subname}</p>
	</div>
</section>
