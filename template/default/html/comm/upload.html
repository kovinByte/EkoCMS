<!-- 图片上传弹窗 -->
<div id="uploadModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-gray-900/60 p-4">
	<div class="w-full max-w-md rounded-lg bg-white shadow-xl">
		<div class="flex items-center justify-between border-b border-gray-100 px-6 py-4">
			<h3 class="text-lg font-semibold text-gray-900">上传图片</h3>
			<button type="button" class="uploadClose flex size-9 items-center justify-center rounded-sm text-gray-400 transition hover:bg-gray-100 hover:text-gray-600" aria-label="关闭">
				<i class="fa-solid fa-xmark"></i>
			</button>
		</div>
		<div class="px-6 py-6">
			<input id="uploadFile" type="file" accept="image/gif,image/jpeg,image/png,image/webp" class="block w-full text-sm text-gray-500 file:mr-4 file:cursor-pointer file:rounded-sm file:border-0 file:bg-blue-50 file:px-4 file:py-2 file:text-sm file:font-medium file:text-blue-600 hover:file:bg-blue-100">
			<p class="mt-3 text-xs text-gray-400">支持 JPG、PNG、GIF、WebP 格式，建议尺寸不超过 1000×1000 像素。</p>
		</div>
		<div class="flex items-center justify-end gap-3 border-t border-gray-100 px-6 py-4">
			<button type="button" class="uploadClose inline-flex h-10 items-center justify-center rounded-sm border border-gray-200 bg-white px-5 text-base font-medium text-gray-600 transition hover:bg-gray-50">取消</button>
			<button type="button" id="uploadSubmit" class="inline-flex h-10 items-center justify-center gap-2 rounded-sm bg-blue-600 px-5 text-base font-medium text-white transition duration-300 hover:scale-105 hover:bg-blue-700 hover:shadow-lg">
				<i class="fa-solid fa-cloud-arrow-up"></i> 上传
			</button>
		</div>
	</div>
</div>

<script>
$(function () {
	var uploadTarget = null;

	$('.upload').on('click', function () {
		uploadTarget = $(this).data('upload-target');
		$('#uploadFile').val('');
		$('#uploadModal').removeClass('hidden').addClass('flex');
	});

	$('.uploadClose').on('click', function () {
		$('#uploadModal').addClass('hidden').removeClass('flex');
	});

	$('#uploadSubmit').on('click', function () {
		var file = $('#uploadFile')[0].files[0];
		if (!file) {
			alert('请选择要上传的图片！');
			return;
		}

		var data = new FormData();
		data.append('upload', file);

		$.ajax({
			type: 'POST',
			url: '{eko:upload}',
			data: data,
			dataType: 'json',
			processData: false,
			contentType: false,
			success: function (response) {
				if (response.code) {
					$(uploadTarget).val(response.data);
					$('img' + uploadTarget).attr('src', '{eko:sitepath}' + response.data);
					$('#uploadModal').addClass('hidden').removeClass('flex');
				} else {
					alert(response.data);
				}
			},
			error: function () {
				alert('返回数据异常！');
			}
		});
	});
});
</script>
