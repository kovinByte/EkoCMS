{include file=comm/top.html}

<div class="mx-auto w-full max-w-5xl px-4 py-12 sm:px-6 md:py-16 lg:px-8">
	<article class="rounded-lg border border-gray-100 bg-white p-6 shadow-md md:p-10">
		<h1 class="text-2xl font-bold leading-snug tracking-tight text-gray-900 md:text-3xl">{content:title}</h1>
		<div class="mt-5 flex flex-wrap items-center gap-x-6 gap-y-2 border-b border-gray-100 pb-5 text-sm text-gray-400">
			<span class="inline-flex items-center gap-1.5"><i class="fa-regular fa-calendar"></i> {content:date style=Y-m-d}</span>
			<span class="inline-flex items-center gap-1.5"><i class="fa-regular fa-eye"></i> 浏览 {content:visits}</span>
		</div>
		<div class="mt-8">
			{include file=comm/prose.html}
		</div>
	</article>

	<div class="mt-6 grid gap-3 text-sm text-gray-500 [&_a]:text-gray-600 [&_a]:transition [&_a:hover]:text-blue-600 md:grid-cols-2">
		<div class="rounded-lg border border-gray-100 bg-white p-4">
			<span class="text-gray-400">上一篇：</span>{content:precontent}
		</div>
		<div class="rounded-lg border border-gray-100 bg-white p-4 md:text-right">
			<span class="text-gray-400">下一篇：</span>{content:nextcontent}
		</div>
	</div>
</div>
