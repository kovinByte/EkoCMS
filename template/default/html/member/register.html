{include file=comm/head.html}

<!-- 会员页头部 -->
<section class="relative overflow-hidden bg-blue-800 pt-18">
	<div class="pointer-events-none absolute -right-24 -top-24 size-96 rounded-full bg-blue-600/30 blur-3xl"></div>
	<div class="pointer-events-none absolute -bottom-28 left-1/4 size-72 rounded-full bg-cyan-500/20 blur-3xl"></div>
	<div class="relative mx-auto w-full max-w-7xl px-4 py-12 sm:px-6 md:py-16 lg:px-8">
		<h1 class="text-3xl font-bold tracking-tight text-white md:text-4xl">注册账号</h1>
		<p class="mt-3 text-base text-blue-100">创建会员账号，享受更便捷的咨询与服务体验。</p>
	</div>
</section>

<div class="mx-auto w-full max-w-lg px-4 py-12 sm:px-6 md:py-16">
	<div class="rounded-lg border border-gray-100 bg-white p-6 shadow-md md:p-8">
		<h2 class="text-xl font-semibold text-gray-900">填写注册信息</h2>
		<p class="mt-2 text-sm text-gray-500">带 <span class="text-red-600">*</span> 的为必填项</p>

		<form class="mt-6 space-y-5" onsubmit="return register(this);">
			<div>
				<label for="username" class="mb-2 block text-sm font-medium text-gray-700">账号 <span class="text-red-600">*</span></label>
				<input type="text" name="username" required id="username" onblur="isRegister()" class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请输入登录账号">
				<p id="usernote" class="mt-1.5 text-xs"></p>
			</div>

			<div>
				<label for="nickname" class="mb-2 block text-sm font-medium text-gray-700">昵称 <span class="text-red-600">*</span></label>
				<input type="text" name="nickname" required id="nickname" class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请输入账号昵称">
			</div>

			<div>
				<label for="password" class="mb-2 block text-sm font-medium text-gray-700">密码 <span class="text-red-600">*</span></label>
				<input type="password" name="password" required id="password" class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请输入登录密码">
			</div>

			<div>
				<label for="rpassword" class="mb-2 block text-sm font-medium text-gray-700">确认密码 <span class="text-red-600">*</span></label>
				<input type="password" name="rpassword" required id="rpassword" class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请再次输入登录密码">
			</div>

			{eko:if({eko:registercodestatus}==1)}
			<div>
				<label for="checkcode" class="mb-2 block text-sm font-medium text-gray-700">验证码 <span class="text-red-600">*</span></label>
				<div class="flex flex-wrap items-center gap-3">
					<input type="text" name="checkcode" required id="checkcode" class="h-11 w-40 rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请输入验证码">
					<img title="点击刷新" id="codeimg" class="h-11 w-32 cursor-pointer rounded-sm border border-gray-200 object-cover" src="{eko:checkcode}" alt="验证码" onclick="this.src='{eko:checkcode}?'+Math.round(Math.random()*10);">
				</div>
			</div>
			{/eko:if}

			{eko:if({eko:registercodestatus}==2)}
			<div>
				<label for="checkcode" class="mb-2 block text-sm font-medium text-gray-700">邮箱验证码 <span class="text-red-600">*</span></label>
				<div class="flex flex-wrap items-center gap-3">
					<input type="text" name="checkcode" required id="checkcode" class="h-11 w-40 rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请输入验证码">
					<button type="button" onclick="sendEmail();" class="inline-flex h-11 items-center justify-center rounded-sm border border-blue-600 bg-white px-5 text-sm font-medium text-blue-600 transition hover:bg-blue-50">发送验证码</button>
				</div>
			</div>
			{/eko:if}

			<button type="submit" class="inline-flex h-11 w-full items-center justify-center gap-2 rounded-sm bg-blue-600 text-base font-medium text-white shadow-md transition duration-300 hover:scale-105 hover:bg-blue-700 hover:shadow-lg active:bg-blue-800">
				<i class="fa-solid fa-user-plus"></i> 立即注册
			</button>
		</form>

		<p class="mt-6 border-t border-gray-100 pt-5 text-center text-sm text-gray-500">
			已有账号？<a href="{eko:login}" class="font-medium text-blue-600 transition hover:text-blue-700">马上登录</a>
		</p>
	</div>
</div>

<script>
function register(obj) {
	var url = '{eko:register}';
	var username = $(obj).find('#username').val();
	var nickname = $(obj).find('#nickname').val();
	var password = $(obj).find('#password').val();
	var rpassword = $(obj).find('#rpassword').val();
	var checkcode = $(obj).find('#checkcode').val();

	$.ajax({
		type: 'POST',
		url: url,
		dataType: 'json',
		data: {
			username: username,
			nickname: nickname,
			password: password,
			rpassword: rpassword,
			checkcode: checkcode
		},
		success: function (response) {
			if (response.code) {
				alert('注册成功！');
				location.href = response.tourl;
			} else {
				$('#codeimg').click();
				alert(response.data);
			}
		},
		error: function () {
			alert('返回数据异常！');
		}
	});
	return false;
}

function sendEmail() {
	var url = '{eko:sendemail}';
	var username = $('#username').val();
	if (!username) {
		setUserNote('请输入需要注册的账号！', false);
		return false;
	}
	$.ajax({
		type: 'POST',
		url: url,
		dataType: 'json',
		data: { to: username },
		success: function (response) {
			alert(response.data);
		},
		error: function () {
			alert('返回数据异常！');
		}
	});
	return false;
}

function setUserNote(text, ok) {
	$('#username')
		.removeClass('border-gray-200 border-red-600 border-emerald-600')
		.addClass(ok ? 'border-emerald-600' : 'border-red-600');
	$('#usernote')
		.removeClass('text-red-600 text-emerald-600')
		.addClass(ok ? 'text-emerald-600' : 'text-red-600')
		.text(text);
}

function isRegister() {
	var url = '{eko:isregister}';
	var username = $('#username').val();
	if (!username) {
		setUserNote('请输入需要注册的账号！', false);
		return false;
	}
	$.ajax({
		type: 'POST',
		url: url,
		dataType: 'json',
		data: { username: username },
		success: function (response) {
			setUserNote(response.data, !response.code);
		},
		error: function () {
			alert('返回数据异常！');
		}
	});
	return false;
}
</script>
