{include file=comm/head.html}

<!-- 会员页头部 -->
<section class="relative overflow-hidden bg-blue-800 pt-18">
	<div class="pointer-events-none absolute -right-24 -top-24 size-96 rounded-full bg-blue-600/30 blur-3xl"></div>
	<div class="pointer-events-none absolute -bottom-28 left-1/4 size-72 rounded-full bg-cyan-500/20 blur-3xl"></div>
	<div class="relative mx-auto w-full max-w-7xl px-4 py-12 sm:px-6 md:py-16 lg:px-8">
		<h1 class="text-3xl font-bold tracking-tight text-white md:text-4xl">修改资料</h1>
		<p class="mt-3 text-base text-blue-100">更新您的个人资料与登录密码。</p>
	</div>
</section>

<div class="mx-auto w-full max-w-7xl px-4 py-12 sm:px-6 md:py-16 lg:px-8">
	<div class="flex flex-col gap-8 lg:flex-row">
		{include file=member/left.html}

		<div class="min-w-0 flex-1">
			<form action="{eko:umodify}" method="post" class="rounded-lg border border-gray-100 bg-white p-6 shadow-md md:p-8">
				<h2 class="text-xl font-semibold text-gray-900">基本资料</h2>
				<p class="mt-2 text-sm text-gray-500">用户名与账号绑定，不支持修改。</p>

				<div class="mt-6 grid gap-5 sm:grid-cols-2">
					<div class="sm:col-span-2">
						<span class="mb-2 block text-sm font-medium text-gray-700">用户名</span>
						<div class="flex h-11 items-center rounded-sm bg-gray-50 px-4 text-sm text-gray-500">{user:username}</div>
					</div>

					<div class="sm:col-span-2">
						<span class="mb-2 block text-sm font-medium text-gray-700">头像</span>
						<input type="hidden" name="headpic" class="headpic" value="{user:headpic}">
						<div class="flex flex-wrap items-center gap-4">
							<div class="flex size-24 items-center justify-center overflow-hidden rounded-lg border border-gray-200 bg-gray-50">
								<img src="{user:headpic}" alt="头像" class="headpic h-full w-full object-cover">
							</div>
							<button type="button" class="upload inline-flex h-10 items-center justify-center gap-2 rounded-sm border border-blue-600 bg-white px-5 text-sm font-medium text-blue-600 transition hover:bg-blue-50" data-upload-target=".headpic">
								<i class="fa-solid fa-cloud-arrow-up"></i> 上传头像
							</button>
						</div>
					</div>

					<div>
						<label for="useremail" class="mb-2 block text-sm font-medium text-gray-700">邮箱</label>
						<input type="text" name="useremail" id="useremail" value="{user:useremail}" autocomplete="off" class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请输入邮箱账号">
					</div>

					<div>
						<label for="usermobile" class="mb-2 block text-sm font-medium text-gray-700">手机</label>
						<input type="text" name="usermobile" id="usermobile" value="{user:usermobile}" autocomplete="off" class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请输入手机号码">
					</div>

					<div>
						<label for="nickname" class="mb-2 block text-sm font-medium text-gray-700">昵称</label>
						<input type="text" name="nickname" id="nickname" value="{user:nickname}" autocomplete="off" class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请输入账号昵称">
					</div>

					<div>
						<label for="sex" class="mb-2 block text-sm font-medium text-gray-700">性别</label>
						<select class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" name="sex" id="sex">
							<option value="男" {eko:if('{user:sex}'=='男')}selected{/eko:if}>男</option>
							<option value="女" {eko:if('{user:sex}'=='女')}selected{/eko:if}>女</option>
						</select>
					</div>

					<div>
						<label for="birthday" class="mb-2 block text-sm font-medium text-gray-700">生日</label>
						<input type="date" class="h-11 w-full max-w-48 rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" name="birthday" id="birthday" value="{user:birthday}">
						<script>(function () { var b = document.getElementById('birthday'); if (!b.value && b.getAttribute('value')) { b.type = 'text'; b.value = b.getAttribute('value'); } })();</script>
					</div>

					<div>
						<label for="qq" class="mb-2 block text-sm font-medium text-gray-700">QQ</label>
						<input type="text" name="qq" id="qq" value="{user:qq}" autocomplete="off" class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请输入QQ号码">
					</div>
				</div>

				<h2 class="mt-10 border-t border-gray-100 pt-8 text-xl font-semibold text-gray-900">修改密码</h2>
				<p class="mt-2 text-sm text-gray-500">如不需要修改密码，请留空。</p>

				<div class="mt-6 grid gap-5 sm:grid-cols-2">
					<div>
						<label for="password" class="mb-2 block text-sm font-medium text-gray-700">新密码</label>
						<input type="password" name="password" id="password" autocomplete="off" class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请输入新登录密码">
					</div>
					<div>
						<label for="rpassword" class="mb-2 block text-sm font-medium text-gray-700">确认密码</label>
						<input type="password" name="rpassword" id="rpassword" autocomplete="off" class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请再次输入新登录密码">
					</div>
				</div>

				<div class="mt-8 border-t border-gray-100 pt-6">
					<label for="opassword" class="mb-2 block text-sm font-medium text-gray-700">当前密码 <span class="text-red-600">*</span></label>
					<input type="password" name="opassword" id="opassword" autocomplete="off" class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20 sm:max-w-sm" placeholder="请输入当前密码以确认修改">
				</div>

				<div class="mt-8 flex flex-wrap gap-3">
					<button type="submit" class="inline-flex h-11 items-center justify-center gap-2 rounded-sm bg-blue-600 px-7 text-base font-medium text-white shadow-md transition duration-300 hover:scale-105 hover:bg-blue-700 hover:shadow-lg active:bg-blue-800">
						<i class="fa-solid fa-check"></i> 保存修改
					</button>
					<a href="{eko:ucenter}" class="inline-flex h-11 items-center justify-center rounded-sm border border-gray-200 bg-white px-7 text-base font-medium text-gray-600 transition hover:bg-gray-50">返回</a>
				</div>
			</form>
		</div>
	</div>
</div>

{include file=comm/upload.html}

{include file=comm/foot.html}
