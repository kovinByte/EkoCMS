{include file=comm/head.html}

<!-- 会员页头部 -->
<section class="relative overflow-hidden bg-blue-800 pt-18">
	<div class="pointer-events-none absolute -right-24 -top-24 size-96 rounded-full bg-blue-600/30 blur-3xl"></div>
	<div class="pointer-events-none absolute -bottom-28 left-1/4 size-72 rounded-full bg-cyan-500/20 blur-3xl"></div>
	<div class="relative mx-auto w-full max-w-7xl px-4 py-12 sm:px-6 md:py-16 lg:px-8">
		<h1 class="text-3xl font-bold tracking-tight text-white md:text-4xl">找回密码</h1>
		<p class="mt-3 text-base text-blue-100">通过注册邮箱验证身份，重新设置登录密码。</p>
	</div>
</section>

<div class="mx-auto w-full max-w-lg px-4 py-12 sm:px-6 md:py-16">
	<div class="rounded-lg border border-gray-100 bg-white p-6 shadow-md md:p-8">
		<h2 class="flex items-center gap-2 text-xl font-semibold text-gray-900">
			<i class="fa-solid fa-key text-blue-600"></i> 重置密码
		</h2>

		<form class="mt-6 space-y-5" onsubmit="return retrieve(this);">
			<div>
				<label for="username" class="mb-2 block text-sm font-medium text-gray-700">账号 <span class="text-red-600">*</span></label>
				<input type="text" name="username" required id="username" class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请输入已注册账号">
			</div>

			<div>
				<label for="email" class="mb-2 block text-sm font-medium text-gray-700">邮箱 <span class="text-red-600">*</span></label>
				<input type="text" name="email" required id="email" class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请输入已注册邮箱">
				<p id="emailnote" class="mt-1.5 text-xs text-red-600"></p>
			</div>

			<div>
				<label for="checkcode" class="mb-2 block text-sm font-medium text-gray-700">邮箱验证码 <span class="text-red-600">*</span></label>
				<div class="flex flex-wrap items-center gap-3">
					<input type="text" name="checkcode" required id="checkcode" class="h-11 w-40 rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请输入验证码">
					<button type="button" onclick="sendEmail();" class="inline-flex h-11 items-center justify-center rounded-sm border border-blue-600 bg-white px-5 text-sm font-medium text-blue-600 transition hover:bg-blue-50">发送验证码</button>
				</div>
			</div>

			<div>
				<label for="password" class="mb-2 block text-sm font-medium text-gray-700">新密码 <span class="text-red-600">*</span></label>
				<input type="password" name="password" required id="password" class="h-11 w-full rounded-sm border border-gray-200 bg-white px-4 text-base text-gray-800 placeholder:text-gray-400 focus:border-blue-600 focus:outline-hidden focus:ring-2 focus:ring-blue-600/20" placeholder="请输入新的密码">
			</div>

			<button type="submit" class="inline-flex h-11 w-full items-center justify-center gap-2 rounded-sm bg-blue-600 text-base font-medium text-white shadow-md transition duration-300 hover:scale-105 hover:bg-blue-700 hover:shadow-lg active:bg-blue-800">
				<i class="fa-solid fa-check"></i> 确认重置
			</button>
		</form>

		<p class="mt-6 border-t border-gray-100 pt-5 text-center text-sm text-gray-500">
			想起密码了？<a href="{eko:login}" class="font-medium text-blue-600 transition hover:text-blue-700">返回登录</a>
		</p>
	</div>
</div>

<script>
function retrieve(obj) {
	var url = '{eko:retrieve}';
	var username = $(obj).find('#username').val();
	var email = $(obj).find('#email').val();
	var checkcode = $(obj).find('#checkcode').val();
	var password = $(obj).find('#password').val();

	$.ajax({
		type: 'POST',
		url: url,
		dataType: 'json',
		data: {
			username: username,
			email: email,
			checkcode: checkcode,
			password: password
		},
		success: function (response) {
			if (response.code) {
				alert('密码设置成功！');
				location.href = response.tourl;
			} else {
				$('#codeimg').click();
				alert(response.data);
			}
		},
		error: function () {
			alert('返回数据异常！');
		}
	});
	return false;
}

function sendEmail() {
	var url = '{eko:sendemail}';
	var email = $('#email').val();
	if (!email) {
		$('#emailnote').text('请输入注册邮箱！');
		return false;
	}
	$.ajax({
		type: 'POST',
		url: url,
		dataType: 'json',
		data: { retrieve: 1, to: email },
		success: function (response) {
			alert(response.data);
		},
		error: function () {
			alert('返回数据异常！');
		}
	});
	return false;
}
</script>
